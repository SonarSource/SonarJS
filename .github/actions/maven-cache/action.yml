name: Setup Maven Cache
description: Restores the Maven cache and optionally saves it from its designated owner job

inputs:
  cache-month:
    description: 'Month string for cache key rotation (YYYY-MM)'
    required: true
  maven-hash:
    description: 'Hash of pom.xml files for cache key'
    required: true
  save:
    description: 'Restore and save the cache from this designated owner job'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Most jobs only consume the cache.
    - name: Restore Maven cache
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: maven-${{ runner.os }}-${{ inputs.cache-month }}-${{ inputs.maven-hash }}
        restore-keys: maven-${{ runner.os }}-${{ inputs.cache-month }}-

    # Only the designated owner job may claim a new immutable cache key. On pull requests,
    # GitHub scopes the saved cache to the pull request merge ref.
    - name: Restore and save Maven cache
      if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: maven-${{ runner.os }}-${{ inputs.cache-month }}-${{ inputs.maven-hash }}
        restore-keys: maven-${{ runner.os }}-${{ inputs.cache-month }}-

    # Clean up any SonarJS artifacts that were restored from cache
    - name: Remove restored SonarJS artifacts
      shell: bash
      run: rm -rf ~/.m2/repository/org/sonarsource/javascript
