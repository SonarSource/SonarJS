name: Setup Orchestrator Cache
description: Selects the Orchestrator home and manages its distribution cache

inputs:
  enabled:
    description: 'Whether to cache distributions; disabled runs use a temporary home'
    required: false
    default: 'true'
  key-prefix:
    description: 'Prefix for the cache key (default: orchestrator-production)'
    required: false
    default: 'orchestrator-production'

runs:
  using: composite
  steps:
    - name: Set orchestrator cache variables
      shell: bash
      run: |
        CACHE_MONTH=$(date +'%Y-%m')
        echo "ORCHESTRATOR_CACHE_MONTH=$CACHE_MONTH" >> "$GITHUB_ENV"
        if [ "$GITHUB_EVENT_NAME" = 'pull_request' ] || [ "$CACHE_ENABLED" != 'true' ]; then
          orchestrator_home="$RUNNER_TEMP/orchestrator-production"
        else
          orchestrator_home="$GITHUB_WORKSPACE/orchestrator"
        fi
        echo "ORCHESTRATOR_HOME=$orchestrator_home" >> "$GITHUB_ENV"
      env:
        CACHE_ENABLED: ${{ inputs.enabled }}

    - name: Cache Orchestrator distributions
      if: inputs.enabled == 'true' && github.event_name != 'pull_request'
      uses: SonarSource/gh-action_cache@10fff0296bfc17164fb1ed6473f7238df3430ebf # v1.7.5
      with:
        backend: ${{ github.event_name == 'merge_group' && 'github' || 's3' }}
        import-github-cache: false
        path: ${{ env.ORCHESTRATOR_HOME }}
        key: ${{ inputs.key-prefix }}-${{ env.ORCHESTRATOR_CACHE_MONTH }}-${{ github.run_id }}
        restore-keys: ${{ inputs.key-prefix }}-${{ env.ORCHESTRATOR_CACHE_MONTH }}-

    - name: Setup Orchestrator home directory
      shell: bash
      run: mkdir -p "$ORCHESTRATOR_HOME"
