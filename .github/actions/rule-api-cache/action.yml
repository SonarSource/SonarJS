name: Setup Rule API Cache
description: Sets up the sonar-rule-api cache on S3

inputs:
  key-prefix:
    description: 'Prefix for the cache key (default: rule-api)'
    required: false
    default: 'rule-api'

runs:
  using: composite
  steps:
    - name: Set Rule API cache variables
      shell: bash
      run: echo "RULE_API_CACHE_DIR=$HOME/.sonar/rule-api" >> $GITHUB_ENV

    # The RSPEC clone evolves independently of the SonarJS source tree.
    - name: Cache Rule API data
      uses: SonarSource/gh-action_cache@10fff0296bfc17164fb1ed6473f7238df3430ebf # v1.7.5
      with:
        backend: ${{ github.event_name == 'merge_group' && 'github' || 's3' }}
        import-github-cache: false
        path: ${{ env.RULE_API_CACHE_DIR }}
        key: ${{ inputs.key-prefix }}-${{ github.run_id }}
        restore-keys: ${{ inputs.key-prefix }}-

    - name: Setup Rule API cache directory
      shell: bash
      run: mkdir -p "$RULE_API_CACHE_DIR"
