name: ruling_bot
description: Sync sonar-lits ruling results and manage fix PRs

inputs:
  github-token:
    description: GitHub token used for PR comments and fix PR management
    required: true
  pr-number:
    description: Pull request number when the workflow runs on a PR
    required: false
    default: ''
  target-ref:
    description: Branch name targeted by ruling maintenance updates
    required: true
  tested-head-sha:
    description: Head commit whose code produced the ruling results
    required: true
  tested-base-sha:
    description: First parent of the tested PR merge commit; empty for a branch run
    required: false
    default: ''
  is-pull-request:
    description: Whether the current workflow run is for a pull request
    required: true
  ruling-failed:
    description: Whether the preceding ruling execution failed
    required: true
  new-results-path:
    description: Path to freshly generated ruling results produced by sonar-lits
    required: true
  old-results-path:
    description: Path to version-controlled baseline ruling results
    required: true

  sources-path:
    description: Local source checkout used for snippets
    required: false
    default: 'its/sources'
  sources-repo-url:
    description: Remote source URL used for file links
    required: false
    default: ''
  rspec-base-url:
    description: RSPEC URL used for rule links
    required: false
    default: 'https://sonarsource.github.io/rspec/#/rspec'
  max-inline-snippets:
    description: Maximum inline snippets before collapsing the full report
    required: false
    default: '10'
  results-artifact-name:
    description: Saved generated-results artifact name
    required: false
    default: 'ruling-results'
  report-workflow:
    description: Reporter workflow filename or ID
    required: false
    default: 'ruling-diff-comment.yml'
  report-workflow-ref:
    description: Ref containing the reporter workflow; empty selects the default branch
    required: false
    default: ''
  tested-commit-sha:
    description: Exact tested commit (synthetic merge for a PR)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run ruling bot
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        TARGET_REF: ${{ inputs.target-ref }}
        TESTED_COMMIT_SHA: ${{ inputs.tested-commit-sha || github.sha }}
        TESTED_HEAD_SHA: ${{ inputs.tested-head-sha }}
        TESTED_BASE_SHA: ${{ inputs.tested-base-sha }}
        IS_PULL_REQUEST: ${{ inputs.is-pull-request }}
        RULING_FAILED: ${{ inputs.ruling-failed }}
        NEW_RESULTS_PATH: ${{ inputs.new-results-path }}
        OLD_RESULTS_PATH: ${{ inputs.old-results-path }}
        SOURCES_PATH: ${{ inputs.sources-path }}
        SOURCES_REPO_URL: ${{ inputs.sources-repo-url }}
        RSPEC_BASE_URL: ${{ inputs.rspec-base-url }}
        MAX_INLINE_SNIPPETS: ${{ inputs.max-inline-snippets }}
        RESULTS_ARTIFACT_NAME: ${{ inputs.results-artifact-name }}
        REPORT_WORKFLOW: ${{ inputs.report-workflow }}
        REPORT_WORKFLOW_REF: ${{ inputs.report-workflow-ref }}
      run: bash "$ACTION_PATH/run.sh"
