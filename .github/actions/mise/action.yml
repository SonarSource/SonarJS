name: Set up mise with S3 tools cache
description: Keep tool installation and environment activation in mise while storing its data in S3
inputs:
  version:
    description: Pinned mise version
    required: true
  install_args:
    description: Tools to install; empty installs the configured tool set
    default: ''
  cache:
    description: Enable S3 cache restore
    default: 'true'
  cache_save:
    description: Allow a success-only post-job cache save
    default: 'false'
runs:
  using: composite
  steps:
    - name: Compute toolchain cache identity
      id: identity
      if: inputs.cache == 'true'
      shell: bash
      env:
        MISE_VERSION_INPUT: ${{ inputs.version }}
        MISE_INSTALL_INPUT: ${{ inputs.install_args }}
        MISE_CONFIG_HASH: ${{ hashFiles('mise.toml', 'mise.lock', 'mise.local.toml', '.mise.toml', '.mise/config.toml', '.config/mise/config.toml', '.tool-versions') }}
      run: node "$GITHUB_ACTION_PATH/key.mjs"
    - name: Restore toolchain cache and register its owner
      if: inputs.cache == 'true'
      uses: SonarSource/gh-action_cache/s3@d8acebf7a4f9bb88e7213390dcb55c1d10fa26f8 # S3 CI storage
      with:
        operation: cache
        environment: ${{ env.CI_STORAGE_ENVIRONMENT }}
        save: ${{ inputs.cache_save }}
        path: ${{ runner.temp }}/sonarjs-mise
        key: mise-${{ runner.os }}-${{ runner.arch }}-${{ steps.identity.outputs.key }}
    - name: Install and activate mise tools
      uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        version: ${{ inputs.version }}
        install_args: ${{ inputs.install_args }}
        mise_dir: ${{ runner.temp }}/sonarjs-mise
        cache: false
