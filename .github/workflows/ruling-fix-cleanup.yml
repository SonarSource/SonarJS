name: Close obsolete ruling fix PRs
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: write
  pull-requests: write
jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: sonar-xs
    concurrency:
      group: ruling-bot-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:
      # Closed-event handling executes only trusted default-branch code, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          install_args: node
      - uses: ./.github/actions/ruling_bot/cleanup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          target-ref: ${{ github.event.pull_request.head.ref }}
