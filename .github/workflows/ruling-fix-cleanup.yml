name: Close obsolete ruling fix PRs
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: write
  pull-requests: write
jobs:
  cleanup:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: sonar-xs
    concurrency:
      group: ruling-bot-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:
      # Closed-event handling executes only trusted default-branch code, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: SonarSource/mise-action-wrapper@65aa289d3f408f4999d13a52a14cde4f54b48442 # 2.0.0
        with:
          version: 2026.10.20
          install_args: node
          persist_github_token: false
      - uses: ./.github/actions/ruling_bot/cleanup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          target-ref: ${{ github.event.pull_request.head.ref }}
