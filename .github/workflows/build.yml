name: CI transfer benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  artifact:
    name: Artifact ${{ matrix.runner }} ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [sonar-m, warp-custom-ubuntu-24-04]
        mode: [streaming, buffered, ranged]
    steps:
      - name: Download with streaming extraction
        if: matrix.mode == 'streaming'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sonarjs-m2
          run-id: 44313095779
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/payload
      - name: Download ZIP without extraction
        if: matrix.mode == 'buffered'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sonarjs-m2
          run-id: 44313095779
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/archive
          skip-decompress: true
      - name: Download with parallel HTTP ranges
        if: matrix.mode == 'ranged'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYBENCH'
          import concurrent.futures, hashlib, json, os, pathlib, subprocess, time, urllib.request
          artifact_id = 14431213796
          size = 437690813
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          request = urllib.request.Request(
              f'https://api.github.com/repos/SonarSource/SonarJS/actions/artifacts/{artifact_id}/zip',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              urllib.request.build_opener(NoRedirect).open(request, timeout=30)
              raise RuntimeError('Expected a signed redirect')
          except urllib.error.HTTPError as error:
              if error.code != 302:
                  raise
              url = error.headers['Location']
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'archive'
          directory.mkdir()
          started = time.monotonic()
          def download(part):
              begin = size * part // 8
              end = size * (part + 1) // 8 - 1
              req = urllib.request.Request(url, headers={'Range': f'bytes={begin}-{end}'})
              with urllib.request.urlopen(req, timeout=120) as response:
                  assert response.status == 206, response.status
                  data = response.read()
              assert len(data) == end - begin + 1, len(data)
              path = directory / f'part-{part}'
              path.write_bytes(data)
              return path
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              parts = list(pool.map(download, range(8)))
          archive = directory / 'sonarjs-m2.zip'
          with archive.open('wb') as output:
              for part in parts:
                  output.write(part.read_bytes())
                  part.unlink()
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          assert digest == '58dba4a3b23e96d6b10c275a296da86f6ed19a691f2a3573cc9eb57d8a54eb14', digest
          print(f'Verified {size} bytes in {time.monotonic() - started:.2f}s using 8 HTTP ranges')
          PYBENCH
      - name: List archive
        if: matrix.mode != 'streaming'
        shell: bash
        run: find "$RUNNER_TEMP/archive" -type f -printf '%f %s bytes\n'
      - name: Extract buffered archive
        if: matrix.mode != 'streaming'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/payload"
          archive_file=$(find "$RUNNER_TEMP/archive" -maxdepth 1 -type f)
          time unzip -q "$archive_file" -d "$RUNNER_TEMP/payload"
      - name: Inspect payload size
        shell: bash
        run: |
          du -sh "$RUNNER_TEMP/payload"
          find "$RUNNER_TEMP/payload" -type f -printf '%s %p\n' | sort -nr | head -15
  cache:
    name: Maven cache ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [sonar-m, warp-custom-ubuntu-24-04]
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: maven-Linux-2026-11-448452204a5426dd301a40813c3bfb5c38b8ddd54088eead2b29790d9232c354
          fail-on-cache-miss: true
