name: Dependency transfer benchmark
on:
  workflow_dispatch:
    inputs:
      restore-only:
        type: boolean
        default: false
permissions:
  id-token: write
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BUILD_NUMBER: ${{ github.run_number }}
  MAVEN_ARGS: -Dlicense.skip=true
  NPM_CONFIG_REPLACE_REGISTRY_HOST: npmjs
jobs:
  dependencies:
    name: Dependency cost on ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: sonar-l
          - os: Windows
            runner: warp-custom-windows-2022-m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785
        with:
          version: 2026.10.20
          cache_save: false
      - id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          url: https://vault.sonar.build
          secrets: |
            development/artifactory-edge-prod/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
      - name: Configure npm registry
        shell: bash
        env:
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          npm config set "//repox.sonar.build/artifactory/api/npm/:_authToken=${ARTIFACTORY_ACCESS_TOKEN}"
          npm config set registry https://repox.sonar.build/artifactory/api/npm/npm/
      - uses: SonarSource/ci-github-actions/config-maven@v2
        with:
          artifactory-reader-role: private-reader
          disable-caching: 'true'
          repox-url: https://repox.sonar.build
      - name: Restore installed npm dependencies from S3
        id: npm_cache
        uses: SonarSource/gh-action_cache@10fff0296bfc17164fb1ed6473f7238df3430ebf
        with:
          backend: s3
          import-github-cache: false
          fallback-to-default-branch: false
          key: dependency-benchmark-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          path: node_modules
      - name: Restore Maven dependencies from S3
        id: maven_cache
        uses: SonarSource/gh-action_cache@10fff0296bfc17164fb1ed6473f7238df3430ebf
        with:
          backend: s3
          import-github-cache: false
          fallback-to-default-branch: false
          key: dependency-benchmark-maven-${{ runner.os }}-v1
          path: ~/.m2/repository
      - name: Compare dependency acquisition costs
        if: inputs.restore-only != true
        shell: bash
        env:
          NPM_S3_HIT: ${{ steps.npm_cache.outputs.cache-hit }}
          MAVEN_S3_HIT: ${{ steps.maven_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          echo "BENCH cache_hits npm=$NPM_S3_HIT maven=$MAVEN_S3_HIT"
          echo "BENCH npm_registry=$(npm config get registry)"
          for repetition in 1 2 3; do
            start=$(node -p 'Date.now()')
            npm ci --cache="$RUNNER_TEMP/edge-npm-$repetition" --no-audit --no-fund
            elapsed=$(( $(node -p 'Date.now()') - start ))
            echo "BENCH npm_edge os=$RUNNER_OS repetition=$repetition milliseconds=$elapsed"
          done
          for repetition in 1 2 3; do
            repository="$RUNNER_TEMP/edge-maven-$repetition"
            start=$(node -p 'Date.now()')
            mvn -B -ntp "-Dmaven.repo.local=$repository" dependency:go-offline -DexcludeReactor=true -DskipTests
            elapsed=$(( $(node -p 'Date.now()') - start ))
            echo "BENCH maven_edge os=$RUNNER_OS repetition=$repetition milliseconds=$elapsed"
          done
          mkdir -p "$HOME/.m2/repository"
          cp -R "$repository"/. "$HOME/.m2/repository/"
          echo "BENCH npm_directory_bytes=$(du -sb node_modules | cut -f1)"
          echo "BENCH maven_directory_bytes=$(du -sb "$HOME/.m2/repository" | cut -f1)"
