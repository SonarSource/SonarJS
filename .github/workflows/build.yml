name: CI transfer benchmark
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        default: transfers
        options: [transfers, s3, repox, repox-qa]
permissions:
  contents: read
  actions: read
  id-token: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  artifact:
    if: inputs.suite == 'transfers'
    name: Artifact ${{ matrix.runner }} ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [sonar-m, warp-custom-ubuntu-24-04]
        mode: [streaming, buffered, ranged]
    steps:
      - name: Download with streaming extraction
        if: matrix.mode == 'streaming'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sonarjs-m2
          run-id: 44313095779
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/payload
      - name: Download ZIP without extraction
        if: matrix.mode == 'buffered'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sonarjs-m2
          run-id: 44313095779
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/archive
          skip-decompress: true
      - name: Download with parallel HTTP ranges
        if: matrix.mode == 'ranged'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYBENCH'
          import concurrent.futures, hashlib, json, os, pathlib, subprocess, time, urllib.request
          artifact_id = 14431213796
          size = 437690813
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          request = urllib.request.Request(
              f'https://api.github.com/repos/SonarSource/SonarJS/actions/artifacts/{artifact_id}/zip',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              urllib.request.build_opener(NoRedirect).open(request, timeout=30)
              raise RuntimeError('Expected a signed redirect')
          except urllib.error.HTTPError as error:
              if error.code != 302:
                  raise
              url = error.headers['Location']
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'archive'
          directory.mkdir()
          started = time.monotonic()
          def download(part):
              begin = size * part // 8
              end = size * (part + 1) // 8 - 1
              req = urllib.request.Request(url, headers={'Range': f'bytes={begin}-{end}'})
              with urllib.request.urlopen(req, timeout=120) as response:
                  assert response.status == 206, response.status
                  data = response.read()
              assert len(data) == end - begin + 1, len(data)
              path = directory / f'part-{part}'
              path.write_bytes(data)
              return path
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              parts = list(pool.map(download, range(8)))
          archive = directory / 'sonarjs-m2.zip'
          with archive.open('wb') as output:
              for part in parts:
                  output.write(part.read_bytes())
                  part.unlink()
          digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
          assert digest == '58dba4a3b23e96d6b10c275a296da86f6ed19a691f2a3573cc9eb57d8a54eb14', digest
          print(f'Verified {size} bytes in {time.monotonic() - started:.2f}s using 8 HTTP ranges')
          PYBENCH
      - name: List archive
        if: matrix.mode != 'streaming'
        shell: bash
        run: find "$RUNNER_TEMP/archive" -type f -printf '%f %s bytes\n'
      - name: Extract buffered archive
        if: matrix.mode != 'streaming'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/payload"
          archive_file=$(find "$RUNNER_TEMP/archive" -maxdepth 1 -type f)
          time unzip -q "$archive_file" -d "$RUNNER_TEMP/payload"
      - name: Inspect payload size
        shell: bash
        run: |
          du -sh "$RUNNER_TEMP/payload"
          find "$RUNNER_TEMP/payload" -type f -printf '%s %p\n' | sort -nr | sed -n '1,15p'
  cache:
    if: inputs.suite == 'transfers'
    name: Maven cache ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [sonar-m, warp-custom-ubuntu-24-04]
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: maven-Linux-2026-11-448452204a5426dd301a40813c3bfb5c38b8ddd54088eead2b29790d9232c354
          fail-on-cache-miss: true
  s3_seed:
    if: inputs.suite == 's3'
    name: Import Maven cache into S3
    runs-on: sonar-m
    timeout-minutes: 15
    steps:
      - uses: SonarSource/gh-action_cache@10fff0296bfc17164fb1ed6473f7238df3430ebf
        with:
          backend: s3
          path: ~/.m2/repository
          key: maven-Linux-2026-11-448452204a5426dd301a40813c3bfb5c38b8ddd54088eead2b29790d9232c354
          fail-on-cache-miss: true
  s3_restore:
    if: inputs.suite == 's3'
    needs: s3_seed
    name: Warm S3 restore ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [sonar-m, warp-custom-ubuntu-24-04]
    steps:
      - uses: SonarSource/gh-action_cache@10fff0296bfc17164fb1ed6473f7238df3430ebf
        with:
          backend: s3
          import-github-cache: 'false'
          path: ~/.m2/repository
          key: maven-Linux-2026-11-448452204a5426dd301a40813c3bfb5c38b8ddd54088eead2b29790d9232c354
          fail-on-cache-miss: true
  repox:
    if: inputs.suite == 'repox'
    name: Download deployed plugin via Repox ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [sonar-m, warp-custom-ubuntu-24-04, warp-custom-windows-2022-m]
    steps:
      - name: Get production Edge reader
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory-edge-prod/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
      - name: Download exact deployed plugin classifiers
        shell: bash
        env:
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          for classifier in '' '-multi' '-win-x64' '-linux-x64' '-linux-x64-musl'; do
            curl --fail --silent --show-error --retry 2 \
              --header "Authorization: Bearer $ARTIFACTORY_ACCESS_TOKEN" \
              --output "$RUNNER_TEMP/plugin$classifier.jar" \
              --write-out "Plugin $classifier: %{size_download} bytes, %{time_total}s, %{speed_download} bytes/sec\n" \
              "https://repox-internal.sonar.build/artifactory/sonarsource-qa/org/sonarsource/javascript/sonar-javascript-plugin/14.6.0.46552/sonar-javascript-plugin-14.6.0.46552$classifier.jar"
          done
  repox_qa:
    if: inputs.suite == 'repox-qa'
    name: Resolve QA dependencies from Repox without GitHub artifacts
    runs-on: sonar-m
    timeout-minutes: 15
    env:
      BUILD_NUMBER: '46552'
      SONARSOURCE_QA: 'true'
      MAVEN_ARGS: -Dlicense.skip=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0a1c6cce4eb0cadb17b03f1a0c6e42364089bfe4
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.10.20
          cache_save: false
          install_args: java maven
      - uses: SonarSource/gh-action_cache@10fff0296bfc17164fb1ed6473f7238df3430ebf
        with:
          backend: s3
          import-github-cache: 'false'
          path: ~/.m2/repository
          key: maven-Linux-2026-11-448452204a5426dd301a40813c3bfb5c38b8ddd54088eead2b29790d9232c354
          fail-on-cache-miss: true
      - name: Confirm SonarJS reactor artifacts are absent
        run: test ! -d "$HOME/.m2/repository/org/sonarsource/javascript"
      - uses: SonarSource/ci-github-actions/config-maven@v2
        with:
          repox-url: https://repox-internal.sonar.build
          artifactory-reader-role: private-reader
          disable-caching: 'true'
      - name: Resolve and compile all three QA test modules
        run: |
          for module in tests fast-tests sonarlint-tests; do
            time mvn -f "its/plugin/$module/pom.xml" -DskipTests test-compile
          done
      - name: Verify plugin JARs match the original GitHub artifact
        run: |
          cd sonar-plugin/sonar-javascript-plugin/target
          sha256sum -c <<'CHECKSUMS'
          4f3a49e3c87ca1c5055dece6e81a99f7e43b73625997dac89128bac412e63de1  sonar-javascript-plugin-14.6.0.46552.jar
          439eace998bd7e643f3a322e4bbeb5dc4fdf448339bb3280e9f36a415ba96dfe  sonar-javascript-plugin-14.6.0.46552-multi.jar
          266de0a174b72251eca78b8aa5050389d24fb31a54d1f7f722caa2eddb45c430  sonar-javascript-plugin-14.6.0.46552-win-x64.jar
          1f882116d9317eeea667ccccd9583259991192b5c996480c99e0d09405b2ec80  sonar-javascript-plugin-14.6.0.46552-linux-x64.jar
          9233b726014cdc6e1379db1a4aca0614f01df960e37534ceaefce27e2ec0536a  sonar-javascript-plugin-14.6.0.46552-linux-x64-musl.jar
          CHECKSUMS
