{
  "name": "Build",
  "on": {
    "workflow_dispatch": {}
  },
  "env": {
    "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": "true",
    "MAVEN_ARGS": "-Dlicense.skip=true"
  },
  "jobs": {
    "minimal_ubuntu_analyzer_check": {
      "name": "One-off EmbeddedNodeTest — SonarJS 14.5.0.46527 / Node 26",
      "runs-on": "warp-custom-ubuntu-24-04",
      "timeout-minutes": 20,
      "container": {
        "image": "ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8"
      },
      "permissions": {
        "id-token": "write",
        "contents": "read"
      },
      "env": {
        "BUILD_NUMBER": "46527"
      },
      "steps": [
        {
          "name": "Prepare minimal Ubuntu environment",
          "run": "apt-get update\napt-get install --no-install-recommends -y ca-certificates curl unzip xz-utils\nrm -rf /var/lib/apt/lists/*\n"
        },
        {
          "name": "Checkout source code",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "name": "Setup Java and Maven",
          "uses": "jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785",
          "with": {
            "version": "2026.10.20",
            "cache_save": false,
            "install_args": "java maven"
          }
        },
        {
          "name": "Configure Maven",
          "id": "config-maven",
          "uses": "SonarSource/ci-github-actions/config-maven@v2",
          "with": {
            "repox-url": "https://repox-internal.sonar.build",
            "artifactory-reader-role": "private-reader",
            "disable-caching": "true"
          }
        },
        {
          "id": "secrets",
          "uses": "SonarSource/vault-action-wrapper@v3",
          "with": {
            "secrets": "development/github/token/licenses-ro token | licenses_token;\ndevelopment/artifactory-edge-prod/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ORCHESTRATOR_ACCESS_TOKEN;\n"
          }
        },
        {
          "name": "Configure production Orchestrator",
          "shell": "bash",
          "env": {
            "ORCHESTRATOR_ACCESS_TOKEN": "${{ fromJSON(steps.secrets.outputs.vault).ORCHESTRATOR_ACCESS_TOKEN }}"
          },
          "run": "umask 077\nconfig_dir=\"$RUNNER_TEMP/orchestrator-production-config\"\nmkdir -p \"$config_dir\"\nprintf '%s\\n' \\\n  'orchestrator.artifactory.url=https://repox-internal.sonar.build/artifactory' \\\n  \"orchestrator.artifactory.accessToken=$ORCHESTRATOR_ACCESS_TOKEN\" > \"$config_dir/orchestrator.properties\"\nconfig_path=\"$config_dir/orchestrator.properties\"\nif [[ \"$RUNNER_OS\" == Windows ]]; then\n  config_path=\"/$(cygpath -m \"$config_path\")\"\nfi\nconfig_path=\"${config_path// /%20}\"\necho \"ORCHESTRATOR_CONFIG_URL=file://$config_path\" >> \"$GITHUB_ENV\"\n"
        },
        {
          "name": "Verify analyzer with bundled Node",
          "run": "# Ensure analysis exercises the bundled runtime without a system Node fallback.\nif command -v node; then\n  echo 'The minimal Ubuntu environment must not supply system Node.' >&2\n  exit 1\nfi\nmvn -Drevision=14.5.0.46527 \"-Dorchestrator.configUrl=$ORCHESTRATOR_CONFIG_URL\" \"-Dorchestrator.home=$ORCHESTRATOR_HOME\" -f its/plugin/fast-tests/pom.xml -DskipTests=false -Dtest=EmbeddedNodeTest -Dsonar.runtimeVersion=LATEST_RELEASE -B -e -V verify\n",
          "env": {
            "SONARSOURCE_QA": true,
            "GITHUB_TOKEN": "${{ fromJSON(steps.secrets.outputs.vault).licenses_token }}"
          }
        },
        {
          "name": "Upload test reports",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "node26-embedded-node-test-reports",
            "path": "its/plugin/fast-tests/target/surefire-reports/",
            "if-no-files-found": "ignore"
          }
        }
      ]
    }
  }
}
