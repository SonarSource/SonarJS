name: Ruling Diff Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true
        type: string
      base-sha:
        description: First parent of the tested PR merge, or tested branch commit
        required: false
        type: string
      head-sha:
        description: Commit tested by ruling (the synthetic merge for a PR)
        required: true
        type: string
      run-id:
        description: Build run containing generated results; required when ruling-failed is true
        required: false
        type: string
      ruling-failed:
        description: Download and apply generated results from the build run
        required: false
        type: boolean
        default: false
      is-pull-request:
        description: Whether the tested commit is a synthetic PR merge
        required: false
        type: boolean
        default: false
      fix-pr-url:
        description: Ruling fix pull request URL, when reporting on the original PR
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr-number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  ruling-diff-comment:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')
    runs-on: sonar-xs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head-sha || github.sha }}
          fetch-depth: 0
          submodules: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install_args: node
      - name: Download generated ruling results
        if: inputs.ruling-failed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: actual_js_ts
          path: packages/ruling/actual
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Post ruling diff from the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
          BASE_SHA: ${{ inputs.base-sha || '' }}
          HEAD_SHA: ${{ inputs.head-sha || github.sha }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' || inputs.is-pull-request }}
          RULING_FAILED: ${{ inputs.ruling-failed }}
          FIX_PR_URL: ${{ inputs.fix-pr-url || '' }}
        run: bash .github/actions/ruling_bot/report.sh
