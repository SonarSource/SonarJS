name: Ruling Diff Comment
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR receiving the report
        required: true
        type: string
      base-sha:
        description: First parent of the tested merge, or tested branch commit
        required: false
        type: string
      head-sha:
        description: Exact tested commit; synthetic merge for a PR
        required: true
        type: string
      run-id:
        description: Build run containing generated results
        required: false
        type: string
      ruling-failed:
        description: Download and apply generated results
        required: false
        type: boolean
        default: false
      is-pull-request:
        description: Tested commit is a synthetic PR merge
        required: false
        type: boolean
        default: false
      fix-pr-url:
        description: Fix PR link for the original PR
        required: false
        type: string
      target-ref:
        description: Original branch tested by ruling
        required: false
        type: string
      run-attempt:
        description: Originating Build run attempt
        required: false
        type: string
        default: '1'
      # BEGIN GENERATED CONFIG INPUTS
      # Owned by config.mjs / .github/ruling-bot.config.mjs; run generate-config.mjs.
      new-results-path:
        description: Generated-results path within the tested repository
        required: false
        type: string
        default: packages/ruling/actual
      old-results-path:
        description: Expected-results path within the tested repository
        required: false
        type: string
        default: its/ruling/src/test/resources/expected
      sources-path:
        description: Local source checkout used for snippets; empty disables snippets
        required: false
        type: string
        default: its/sources
      sources-repo-url:
        description: Remote source URL used for file links; empty disables links
        required: false
        type: string
        default: https://github.com/SonarSource/jsts-test-sources/blob/master
      rspec-base-url:
        description: RSPEC URL used for rule links; empty disables links
        required: false
        type: string
        default: https://musical-adventure-r9qk65j.pages.github.io/rspec/#
      max-inline-snippets:
        description: Maximum detailed snippets per report section
        required: false
        type: string
        default: '10'
      results-artifact-name:
        description: Exact saved generated-results artifact name
        required: false
        type: string
        default: ''
      report-workflow:
        description: Reporter workflow filename or ID
        required: false
        type: string
        default: ruling-diff-comment.yml
      report-workflow-ref:
        description: Reporter workflow ref; empty selects the tested target branch
        required: false
        type: string
        default: ''
      build-workflow:
        description: Build workflow filename or ID used to find authoritative dispatches
        required: false
        type: string
        default: build.yml
      report-dispatch-step:
        description: Build step recording a successful ruling report request
        required: false
        type: string
        default: Record ruling report dispatch
      # END GENERATED CONFIG INPUTS

# Separate tested commits so an old dispatch cannot replace a newer pending report.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr-number || github.event.pull_request.number }}-${{ inputs.head-sha || github.sha }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
  pull-requests: write
  actions: read
jobs:
  ruling-diff-comment:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')
    runs-on: sonar-xs
    # Share the mutation lock with the updater and close/merge cleanup. Keep pending work.
    concurrency:
      group: ${{ (github.event_name == 'pull_request' || inputs.is-pull-request) && format('ruling-bot-pr-{0}', inputs.pr-number || github.event.pull_request.number) || format('ruling-bot-branch-{0}', inputs.target-ref) }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout the tested tree and its ruling bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head-sha || github.sha }}
          fetch-depth: 2
          submodules: true
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.9.18
          install_args: node
      - name: Report results from the tested tree
        uses: ./.github/actions/ruling_bot/report
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ inputs.pr-number || github.event.pull_request.number }}
          base-sha: ${{ inputs.base-sha || '' }}
          head-sha: ${{ inputs.head-sha || github.sha }}
          target-ref: ${{ inputs.target-ref || github.head_ref }}
          is-pull-request: ${{ github.event_name == 'pull_request' || inputs.is-pull-request }}
          ruling-failed: ${{ inputs.ruling-failed || false }}
          run-id: ${{ inputs.run-id || '' }}
          run-attempt: ${{ inputs.run-attempt || '1' }}
          fix-pr-url: ${{ inputs.fix-pr-url || '' }}
          # BEGIN GENERATED REPORT CONFIG
          # Owned by config.mjs / .github/ruling-bot.config.mjs; run generate-config.mjs.
          new-results-path: ${{ github.event_name == 'pull_request' && 'packages/ruling/actual' || inputs.new-results-path }}
          old-results-path: ${{ github.event_name == 'pull_request' && 'its/ruling/src/test/resources/expected' || inputs.old-results-path }}
          sources-path: ${{ github.event_name == 'pull_request' && 'its/sources' || inputs.sources-path }}
          sources-repo-url: ${{ github.event_name == 'pull_request' && 'https://github.com/SonarSource/jsts-test-sources/blob/master' || inputs.sources-repo-url }}
          rspec-base-url: ${{ github.event_name == 'pull_request' && 'https://musical-adventure-r9qk65j.pages.github.io/rspec/#' || inputs.rspec-base-url }}
          max-inline-snippets: ${{ github.event_name == 'pull_request' && '10' || inputs.max-inline-snippets }}
          results-artifact-name: ${{ inputs.results-artifact-name || format('actual_js_ts-{0}', inputs.run-attempt || '1') }}
          report-workflow: ${{ github.event_name == 'pull_request' && 'ruling-diff-comment.yml' || inputs.report-workflow }}
          report-workflow-ref: ${{ github.event_name == 'pull_request' && '' || inputs.report-workflow-ref }}
          build-workflow: ${{ github.event_name == 'pull_request' && 'build.yml' || inputs.build-workflow }}
          report-dispatch-step: ${{ github.event_name == 'pull_request' && 'Record ruling report dispatch' || inputs.report-dispatch-step }}
          # END GENERATED REPORT CONFIG
