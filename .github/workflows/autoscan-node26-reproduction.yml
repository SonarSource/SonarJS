name: Autoscan Node 26 reproduction

on:
  push:
    branches: [codex/autoscan-node26-reproduction]
    paths:
      - .github/workflows/autoscan-node26-reproduction.yml
      - tools/reproduce-autoscan-node26.sh

permissions:
  contents: read
  id-token: write

jobs:
  reproduce:
    runs-on: warp-custom-ubuntu-24-04
    timeout-minutes: 20
    env:
      # Matches worker/docker/Dockerfile at sonarcloud-autoscan commit
      # 5feb3d9f491ae348629df3b65780f02b4b563397. This is the public
      # base image, not the private production worker image numbered 9706.
      AUTOSCAN_IMAGE: public.ecr.aws/amazoncorretto/amazoncorretto:25.0.3-al2023-headful
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get read-only artifact credentials
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory-edge-prod/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
      - name: Download the runtimes used by SonarJS 14.4 and 14.5
        env:
          ARTIFACTORY_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/autoscan-node26/runtimes" "$RUNNER_TEMP/autoscan-node26/results"
          for version in 24.22.1.10229 26.13.1.10255; do
            curl --fail --silent --show-error --retry 3 \
              --header "Authorization: Bearer $ARTIFACTORY_ACCESS_TOKEN" \
              "https://repox-internal.sonar.build/artifactory/sonarsource/org/sonarsource/nodejs/nodejs-runtime/$version/nodejs-runtime-$version.jar" \
              --output "$RUNNER_TEMP/autoscan-node26/runtimes/$version.jar"
          done
          python3 - <<'PY'
          import hashlib
          import lzma
          import os
          from pathlib import Path
          import zipfile

          root = Path(os.environ['RUNNER_TEMP']) / 'autoscan-node26'
          for version in ('24.22.1.10229', '26.13.1.10255'):
              with zipfile.ZipFile(root / 'runtimes' / (version + '.jar')) as jar:
                  archive = jar.read('runtimes/linux-x64/bin/node.xz')
                  reported_version = jar.read('runtimes/linux-x64/version.txt').decode().strip()
              binary = lzma.decompress(archive)
              target = root / 'runtimes' / ('node-' + version.split('.')[0])
              target.write_bytes(binary)
              target.chmod(0o755)
              print(version, reported_version, 'sha256=' + hashlib.sha256(binary).hexdigest())
          PY
      - name: Reproduce the missing library and test the libatomic control
        shell: bash
        run: |
          set -euo pipefail
          bash tools/reproduce-autoscan-node26.sh \
            "$AUTOSCAN_IMAGE" "$RUNNER_TEMP/autoscan-node26"
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autoscan-node26-reproduction
          path: ${{ runner.temp }}/autoscan-node26/results
          if-no-files-found: warn
          retention-days: 7
