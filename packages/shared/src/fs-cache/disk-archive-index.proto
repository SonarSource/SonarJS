syntax = "proto3";

package sonarsource.sonarjs.fs_cache;

// A compressed encoding of this index follows the compressed blob section of a disk archive. The
// fixed footer stores its offset and compressed length, so readers never scan or deserialize file
// contents to find an entry.
message DiskArchiveIndex {
  string magic = 1;
  uint32 format_version = 2;
  string analyzer_version = 3;
  string created_at = 4;
  string updated_at = 5;
  repeated DiskArchiveEntry entries = 6;
}

message DiskArchiveEntry {
  string path = 1;

  // Semantic nodes have intentionally flexible operation maps. Successful content outcomes use a
  // blob reference containing offset, compressedLength, and rawLength instead of base64 data.
  bytes node_json = 2;
}
